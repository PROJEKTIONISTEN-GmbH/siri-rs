[package]
name = "siri-rs"
version = "1.0.0"
edition = "2021"
authors = ["Marcel Kaufmann <kaufmann@projektionisten.de>"]
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "CEN SIRI (EN 15531) in Rust: every functional service, the publish/subscribe hub as types and as state machines, XML verified against the official schemas"
repository = "https://github.com/PROJEKTIONISTEN-GmbH/siri-rs"
documentation = "https://docs.rs/siri-rs"
readme = "README.md"
keywords = ["siri", "public-transport", "gtfs-realtime", "vdv", "xml"]
categories = ["parser-implementations", "encoding", "api-bindings"]

# The measurements live in `benches/`, so the library itself is not a benchmark
# target; leaving it as one would hand `cargo bench`'s arguments to a harness that
# does not understand them.
[lib]
bench = false

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["std", "serde", "alloc"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The transport the examples and the HTTP endpoint test use. The library builds and
# reads the messages; carrying them is the application's business, so these are
# development dependencies rather than dependencies. TLS is left out because the
# examples talk to localhost — a deployment adds reqwest's `default-tls` or
# `rustls-tls` feature.
axum = "0.7"
chrono = { version = "0.4.38", default-features = false, features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["charset"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

# The benchmark harness. Its report generation and its thread pool are left out:
# the benchmarks below are single-threaded and read as text on the terminal.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "serialize"
harness = false

[[bench]]
name = "pubsub"
harness = false

# What a release build of this crate's own artefacts uses, benchmarks included —
# `bench` inherits from `release`. A library cannot impose a profile on the program
# that uses it, so this settles nothing downstream; the settings a consumer should
# ask for are on the front page.
[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
