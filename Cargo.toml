[package]
name = "siri"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "CEN SIRI (EN 15531) types and publish/subscribe protocol logic — Situation Exchange (SIRI-SX), transport-agnostic, schema-verified"
repository = "https://github.com/siri-rs/siri"
documentation = "https://docs.rs/siri"
readme = "README.md"
keywords = ["siri", "public-transport", "gtfs-realtime", "vdv", "xml"]
categories = ["parser-implementations", "encoding", "api-bindings"]

[dependencies]
chrono = { version = "0.4.38", default-features = false, features = ["std", "serde", "alloc"] }
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The transport the examples and the HTTP endpoint test use. The library builds and
# reads the messages; carrying them is the application's business, so these are
# development dependencies rather than dependencies. TLS is left out because the
# examples talk to localhost — a deployment adds reqwest's `default-tls` or
# `rustls-tls` feature.
axum = "0.7"
chrono = { version = "0.4.38", features = ["clock"] }
reqwest = { version = "0.12", default-features = false, features = ["charset"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
