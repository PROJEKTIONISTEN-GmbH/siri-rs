# The checks every change of siri-rs passes. They need nothing from outside the
# repository but xmllint, with which the tests validate what the crate writes
# against the official schemas the repository carries.
#
# The runner image is named, not `ubuntu-latest`: a schema test reads what the
# image's xmllint writes, and libxml2 words its complaints otherwise from one
# release to the next (2.9 on Ubuntu 24.04, 2.15 on 26.04). A new image is a
# change of this file, tried like any other.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # The publication checks among the tests hold the source to rustfmt.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install --yes libxml2-utils
      - run: xmllint --version
      - run: cargo test --locked
      # The lenient reader is a feature; its tests run with it on.
      - run: cargo test --locked --all-features

  msrv:
    name: minimum supported Rust (1.75)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
      # The development dependencies need a newer compiler than the library, so
      # the library is checked on its own, with every feature.
      - run: cargo +1.75 check --locked --lib --all-features

  lint:
    name: rustfmt, clippy, rustdoc
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo doc --locked --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
